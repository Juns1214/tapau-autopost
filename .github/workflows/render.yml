name: Render and post episode
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder under episodes/ (e.g. 2026-11-20_us_v9)"
        required: true
        default: "2026-11-20_us_v9"
      post:
        description: "none = render only; unpublished = upload as hidden test post; publish = go live"
        required: true
        default: "none"
        type: choice
        options: [none, unpublished, publish]
permissions:
  contents: write
env:
  FB_PAGE_ID: "1541675575685159"
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EP: ${{ inputs.episode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Remotion + fonts
        working-directory: remotion
        run: npm install --no-audit --no-fund && npm run fonts
      - name: Stage episode assets
        run: |
          cp -r episodes/$EP/img/. remotion/public/img/
          cp episodes/$EP/scenes.json remotion/src/scenes.json
          cp episodes/$EP/mix.m4a remotion/public/mix.m4a
      - name: Render
        working-directory: remotion
        run: npx remotion render src/index.ts Recap out/$EP.mp4 --concurrency=4 --crf=20 --browser-executable=$(which google-chrome)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.episode }}
          path: remotion/out/*.mp4
          retention-days: 7
      - name: Publish video file as a release asset (direct download URL for Facebook)
        if: inputs.post != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "ep-$EP" -y --cleanup-tag 2>/dev/null || true
          gh release create "ep-$EP" "remotion/out/$EP.mp4" --title "$EP" --notes "Rendered by GitHub Actions"
      - name: Post to Facebook via Composio
        if: inputs.post != 'none'
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          MODE: ${{ inputs.post }}
          VIDEO_URL: https://github.com/${{ github.repository }}/releases/download/ep-${{ inputs.episode }}/${{ inputs.episode }}.mp4
        run: python3 scripts/post_facebook.py
