name: Check secrets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Composio key + Facebook connection
        env:
          KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          code=$(curl -s -o r.json -w "%{http_code}" -H "x-api-key: $KEY" "https://backend.composio.dev/api/v3/connected_accounts?toolkit_slugs=facebook&statuses=ACTIVE&limit=10")
          echo "Composio HTTP $code"
          python3 -c "import json;d=json.load(open('r.json'));print('active facebook connections:', len(d.get('items',[])))"
          test "$code" = "200"
      - name: Azure Speech key (eastus)
        env:
          KEY: ${{ secrets.AZURE_API_KEY }}
        run: |
          code=$(curl -s -o t.wav -w "%{http_code}" -X POST "https://eastus.tts.speech.microsoft.com/cognitiveservices/v1" \
            -H "Ocp-Apim-Subscription-Key: $KEY" -H "Content-Type: application/ssml+xml" -H "X-Microsoft-OutputFormat: riff-24khz-16bit-mono-pcm" -H "User-Agent: tapau" \
            --data '<speak version="1.0" xml:lang="zh-CN"><voice name="zh-CN-XiaochenNeural">测试</voice></speak>')
          echo "Azure HTTP $code, bytes $(stat -c %s t.wav)"
          test "$code" = "200"
